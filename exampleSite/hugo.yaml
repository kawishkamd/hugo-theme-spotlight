baseURL: 'https://example.com/'
locale: 'en-us'
disableKinds: ["taxonomy", "term"]
title: 'Alex Rivera | Software Engineer'
enableRobotsTXT: true
buildFuture: true
theme: 'baremetal'

params:
  # Identity & Header
  author: "Alex Rivera"
  brand_text: "AR"
  role: "Software Engineer"
  hero_description: "Building scalable web applications, distributed systems, and modern developer tooling."
  hero_bio: "I craft clean code, design robust backend microservices, and build modern reactive interfaces - powered by"
  hero_chips:
    - "TypeScript"
    - "Go"
    - "React"
    - "Python"
    - "PostgreSQL"
    - "Docker"
  site_description: "Portfolio of Alex Rivera, a Software Engineer sharing full-stack projects, distributed systems, and developer tools."
  site_image: "/img/share.jpg"
  avatar: "/img/avatar.webp"
  verified_badge: true

  # SEO & Verification (Optional)
  # google_site_verification: "your-code-here"
  # google_analytics: "G-XXXXXXXXXX"

  # Social Links
  github: "https://github.com/example"
  linkedin: "https://linkedin.com/in/example"
  linkedin_name: "Alex Rivera"
  x: "https://x.com/example"
  email: "alex@example.com"

  # Modular Section Toggles (set to false to hide any section)
  sections:
    spotlight: true
    projects: true
    experience: true
    tech_stack: true
    credentials: true
    github_activity: true
    contact: true

