  contact_heading: "Let's work together."
  contact_bio: "Available for full-stack engineering roles, distributed systems consulting, and technical architecture. Open to discuss web performance, backend scalability, and open-source tooling."

  # Footer
  footer_quote: "Writing clean code. Shipping reliable systems."

# Navigation Menu (Optional)
menus:
  main:
    - name: "Projects"
      url: "/projects/"
      weight: 10
    - name: "Experience"
      url: "/experience/"
      weight: 20
    - name: "Certs"
      url: "/certifications/"
      weight: 30
