baseURL: 'https://example.com/'
locale: 'en-us'
disableKinds: ["taxonomy", "term"]
title: 'Baremetal Portfolio'
enableRobotsTXT: true
buildFuture: true
theme: 'baremetal'

params:
  # Identity & Header
  author: "Alex Morgan"
  brand_text: "AM"
  role: "Systems & Infrastructure Engineer"
  hero_description: "Automating systems and building reliable infrastructure from bare metal to cloud."
  site_description: "A minimalist, zero-dependency portfolio theme engineered for systems administrators and DevOps developers."
  site_image: "/img/share.jpg"
  avatar: "/img/avatar.webp" # or /img/avatar.svg
  verified_badge: true

  # SEO & Verification (Optional)
  # google_site_verification: "your-code-here"

  # Social Links
  github: "https://github.com/example"
  linkedin: "https://linkedin.com/in/example"
  linkedin_name: "Alex Morgan"
  youtube: "https://youtube.com/@example"
  x: "https://x.com/example"
  email: "alex@example.com"
  medium: "https://medium.com/@example"

  # Modular Section Toggles (set to false to hide any section)
  sections:
    projects: true
    experience: true
    credentials: true
    github_activity: true
    writing: true
    contact: true

  # Contact & Sticky Note Annotation
  contact_heading: "Let's work together."
  contact_annotation: true
  contact_note: "contact is right here - say hello :)"

  # Footer
  footer_quote: "Code with precision. Ship with confidence."

# Navigation Menu (Optional - defaults to Projects, Experience, Certs if omitted)
menus:
  main:
    - name: "Projects"
      url: "/projects/"
      weight: 10
    - name: "Experience"
      url: "/experience/"
      weight: 20
    - name: "Certs"
      url: "/certifications/"
      weight: 30
